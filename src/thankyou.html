<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | ZEL Call Center Assist</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffffff 0%, #eff6ff 50%, #dbeafe 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glowing orbs */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      pointer-events: none;
      animation: float-orb 12s ease-in-out infinite alternate;
    }

    .glow-orb-1 {
      width: 450px;
      height: 450px;
      background: #bfdbfe;
      top: -100px;
      right: -100px;
    }

    .glow-orb-2 {
      width: 500px;
      height: 500px;
      background: #93c5fd;
      bottom: -120px;
      left: -120px;
      animation-delay: -6s;
    }

    @keyframes float-orb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.08); }
    }

    .thank-you-card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 60px 80px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid #bfdbfe;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(37, 99, 235, 0.08), 0 1px 3px rgba(37, 99, 235, 0.05);
      animation: enter-card 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      max-width: 680px;
      width: 90%;
    }

    @keyframes enter-card {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 800;
      color: #1e3a8a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.06);
    }

    .brand-icon {
      font-size: 16px;
    }

    h1.thank-you-title {
      font-size: clamp(48px, 8vw, 84px);
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1.05;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .accent-bar {
      width: 60px;
      height: 4px;
      background: #2563eb;
      border-radius: 2px;
      margin: 16px auto 0 auto;
    }
  </style>
</head>
<body>
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <main class="thank-you-card">
    <div class="brand-pill">
      <span class="brand-icon">🐼</span>
      <span>ZEL Call Center Assist</span>
    </div>
    
    <h1 class="thank-you-title">Thank You</h1>
    
    <div class="accent-bar"></div>
  </main>
</body>
</html>
