<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="headsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Panda Ears -->
  <circle cx="15" cy="18" r="9.5" fill="#0f172a" />
  <circle cx="16" cy="18" r="4.5" fill="#334155" />
  <circle cx="49" cy="18" r="9.5" fill="#0f172a" />
  <circle cx="48" cy="18" r="4.5" fill="#334155" />

  <!-- Headset Band (Contact Center Copilot) -->
  <path d="M 10 28 C 10 9, 54 9, 54 28" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" />
  <rect x="7" y="24" width="5.5" height="11" rx="2.5" fill="#2563eb" />
  <rect x="8.5" y="25.5" width="2.5" height="8" rx="1.2" fill="#38bdf8" />
  <rect x="51.5" y="24" width="5.5" height="11" rx="2.5" fill="#2563eb" />
  <rect x="53" y="25.5" width="2.5" height="8" rx="1.2" fill="#38bdf8" />

  <!-- Panda Head -->
  <ellipse cx="32" cy="38" rx="23" ry="19.5" fill="#ffffff" stroke="#0f172a" stroke-width="2" />

  <!-- Black Eye Patches -->
  <ellipse cx="22.5" cy="35" rx="6.5" ry="8.2" fill="#0f172a" transform="rotate(-16 22.5 35)" />
  <ellipse cx="41.5" cy="35" rx="6.5" ry="8.2" fill="#0f172a" transform="rotate(16 41.5 35)" />

  <!-- Eyes & Sparkles -->
  <ellipse cx="23" cy="34.5" rx="3.5" ry="4.5" fill="#ffffff" />
  <circle cx="23.5" cy="34" r="2.2" fill="#0f172a" />
  <circle cx="24.2" cy="33.2" r="1.1" fill="#ffffff" />

  <ellipse cx="41" cy="34.5" rx="3.5" ry="4.5" fill="#ffffff" />
  <circle cx="40.5" cy="34" r="2.2" fill="#0f172a" />
  <circle cx="41.2" cy="33.2" r="1.1" fill="#ffffff" />

  <!-- Rosy Cheeks -->
  <ellipse cx="14.5" cy="41" rx="3.5" ry="2.2" fill="#f472b6" opacity="0.65" />
  <ellipse cx="49.5" cy="41" rx="3.5" ry="2.2" fill="#f472b6" opacity="0.65" />

  <!-- Nose & Smile -->
  <ellipse cx="32" cy="40.5" rx="3.5" ry="2.2" fill="#0f172a" />
  <path d="M 32 42.7 L 32 44.5" stroke="#0f172a" stroke-width="1.3" stroke-linecap="round" />
  <path d="M 27.5 44.5 Q 32 48 36.5 44.5" fill="none" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round" />

  <!-- Headset Microphone Boom -->
  <path d="M 52 33 Q 48 46 39 46.5" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="37.5" cy="46.5" r="2.4" fill="#2563eb" />
  <circle cx="37.5" cy="46.5" r="1.2" fill="#38bdf8" />
</svg>