<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- PANDA ANIMAL ICON (🐼) -->
  
  <!-- Left & Right Ears (Round Black Panda Ears) -->
  <circle cx="16" cy="16" r="10" fill="#111827" stroke="#030712" stroke-width="1.5" />
  <circle cx="17" cy="16" r="5" fill="#374151" />
  
  <circle cx="48" cy="16" r="10" fill="#111827" stroke="#030712" stroke-width="1.5" />
  <circle cx="47" cy="16" r="5" fill="#374151" />

  <!-- Panda Head (Fluffy White Face with crisp dark outline) -->
  <ellipse cx="32" cy="36" rx="24" ry="21" fill="#ffffff" stroke="#111827" stroke-width="2.5" />

  <!-- Iconic Black Eye Patches (Angled Inward) -->
  <ellipse cx="22" cy="33" rx="6.5" ry="8.5" fill="#111827" transform="rotate(-15 22 33)" />
  <ellipse cx="42" cy="33" rx="6.5" ry="8.5" fill="#111827" transform="rotate(15 42 33)" />

  <!-- Expressive Sparkling Eyes -->
  <!-- Left Eye -->
  <ellipse cx="22.5" cy="32.5" rx="3.5" ry="4.5" fill="#ffffff" />
  <circle cx="23" cy="32" r="2.4" fill="#0f172a" />
  <circle cx="24.2" cy="31" r="1.1" fill="#ffffff" />
  <circle cx="22" cy="33.2" r="0.6" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="41.5" cy="32.5" rx="3.5" ry="4.5" fill="#ffffff" />
  <circle cx="41" cy="32" r="2.4" fill="#0f172a" />
  <circle cx="41.8" cy="31" r="1.1" fill="#ffffff" />
  <circle cx="39.8" cy="33.2" r="0.6" fill="#ffffff" />

  <!-- Rosy Pink Cheeks -->
  <ellipse cx="13.5" cy="40" rx="3.8" ry="2.2" fill="#f472b6" opacity="0.75" />
  <ellipse cx="50.5" cy="40" rx="3.8" ry="2.2" fill="#f472b6" opacity="0.75" />

  <!-- Panda Nose (Soft triangular black button) -->
  <ellipse cx="32" cy="39" rx="3.8" ry="2.4" fill="#111827" />
  <ellipse cx="32" cy="38.3" rx="1.5" ry="0.8" fill="#4b5563" />

  <!-- Philtrum and Cute 'W' Smile -->
  <line x1="32" y1="41.4" x2="32" y2="43.5" stroke="#111827" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 27 43.5 Q 32 47.5 37 43.5" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round" />
</svg>
